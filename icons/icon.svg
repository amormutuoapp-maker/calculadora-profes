<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icono de la calculadora (T-014): un signo más grueso, con esquinas
       ligeramente redondeadas. Tinta de los dígitos del LCD (#1A2614)
       sobre el verde del LCD (#C5D6AE) y marco de carcasa (#1C2422).
       Sin texto, sin degradados y sin recursos externos.
       El PNG maskable se genera a partir de este dibujo: el mismo signo
       más, con el verde del LCD a sangre y dentro de la zona segura. -->
  <rect id="case" width="512" height="512" fill="#1C2422"/>
  <rect id="lcd" x="40" y="40" width="432" height="432" rx="48" fill="#C5D6AE"/>
  <rect id="plus-vertical" x="208" y="104" width="96" height="304" rx="16" fill="#1A2614"/>
  <rect id="plus-horizontal" x="104" y="208" width="304" height="96" rx="16" fill="#1A2614"/>
</svg>
